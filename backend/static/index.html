<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS-HYPER - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
<style>

:root{--ink:#05070b;--panel:#0a0f16;--panel2:#0d141d;--line:#253241;--ice:#dff7ff;--muted:#718294;--accent:#62e6ff;--hot:#ffb86b;--ok:#73f5b0;--danger:#ff6b7a;--serif:Georgia,'Times New Roman',serif;--sans:Inter,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--ink);color:var(--ice);font-family:var(--sans);display:flex;align-items:stretch;justify-content:center;overflow:hidden;position:relative}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 18% 20%,rgba(98,230,255,.12),transparent 28%),radial-gradient(circle at 82% 80%,rgba(255,184,107,.08),transparent 26%),linear-gradient(115deg,#030509,#071018 48%,#04070b);z-index:-3}
body:after{content:"";position:fixed;inset:0;opacity:.25;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(to bottom,black,transparent 85%);z-index:-2}
.login-card{width:min(1080px,94vw);min-height:min(690px,92vh);margin:auto;display:grid;grid-template-columns:1.05fr .95fr;background:linear-gradient(135deg,rgba(13,20,29,.97),rgba(5,8,12,.98));border:1px solid #1d2a37;box-shadow:0 35px 90px rgba(0,0,0,.6),inset 0 1px rgba(255,255,255,.035);position:relative;overflow:hidden;border-radius:3px}
.login-card:before{content:"JARVIS // ACCESS NODE 07";position:absolute;top:17px;left:22px;font-size:10px;letter-spacing:3px;color:#536678}.login-card:after{content:"";position:absolute;right:0;top:0;width:34%;height:100%;background:linear-gradient(90deg,transparent,rgba(98,230,255,.025));pointer-events:none}
.brand{grid-column:1;display:flex;flex-direction:column;justify-content:center;padding:90px 64px 64px;border-right:1px solid #1c2833;position:relative}.brand:before{content:"";width:150px;height:150px;border:1px solid rgba(98,230,255,.2);border-radius:50%;position:absolute;top:80px;left:50%;transform:translateX(-50%);box-shadow:0 0 55px rgba(98,230,255,.06)}
.brand h1{font-family:var(--serif);font-weight:400;letter-spacing:8px;font-size:clamp(2rem,4vw,3.5rem);margin:120px 0 12px;color:#f3fbff;position:relative}.brand h1 i{color:var(--accent);font-size:.7em}.brand p{margin:0;color:#71899b;letter-spacing:4px;font-size:11px;text-transform:uppercase}
.system-line{margin-top:34px;display:flex;align-items:center;gap:10px;color:#879baa;font-size:11px;letter-spacing:1.5px}.pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 16px var(--ok);animation:pulse 1.8s infinite}.security-note{margin-top:28px;padding-top:20px;border-top:1px solid #1c2833;color:#566b7c;font-size:11px;line-height:1.8;max-width:390px}.corner{position:absolute;width:34px;height:34px;border-color:#345060!important;opacity:.8}.corner.tl{top:16px;left:16px;border-top:1px solid;border-left:1px solid}.corner.tr{top:16px;right:16px;border-top:1px solid;border-right:1px solid}.corner.bl{bottom:16px;left:16px;border-bottom:1px solid;border-left:1px solid}.corner.br{bottom:16px;right:16px;border-bottom:1px solid;border-right:1px solid}
.login-card> .nav-tabs{grid-column:2;align-self:end;margin:0 48px;border:0;display:flex;gap:28px}.nav-tabs .nav-link{border:0!important;border-bottom:1px solid transparent!important;border-radius:0;color:#566978;background:transparent;padding:12px 0;font-size:11px;letter-spacing:2px;text-transform:uppercase}.nav-tabs .nav-link.active{color:var(--accent);background:transparent;border-bottom-color:var(--accent)!important}
#faceMode,#passwordMode{grid-column:2;padding:28px 48px 64px;align-self:start}.camera-box{aspect-ratio:4/3;background:#020406;border:1px solid #263744;border-radius:0;position:relative;overflow:hidden;margin-bottom:20px;box-shadow:inset 0 0 0 10px #071018,inset 0 0 60px rgba(98,230,255,.08)}.camera-box:before,.camera-box:after{content:"";position:absolute;pointer-events:none}.camera-box:before{inset:12%;border:1px solid rgba(98,230,255,.25);clip-path:polygon(0 0,18% 0,18% 2px,0 2px,0 18%,2px 18%,2px 0,100% 0,100% 18%,calc(100% - 2px) 18%,calc(100% - 2px) 0,100% 0,100% 100%,82% 100%,82% calc(100% - 2px),100% calc(100% - 2px),100% 82%,calc(100% - 2px) 82%,calc(100% - 2px) 100%,0 100%,0 82%,2px 82%,2px 100%,0 100%)}.camera-box:after{width:60%;height:1px;left:20%;top:50%;background:rgba(98,230,255,.35);box-shadow:0 0 20px var(--accent);animation:scan 3s linear infinite}.camera-box video{width:100%;height:100%;object-fit:cover;filter:saturate(.7) contrast(1.1)}.camera-box .placeholder{color:#536879;font-size:11px;letter-spacing:2px;text-transform:uppercase}.camera-box .placeholder i{font-size:2rem;color:#35505f;display:block;margin-bottom:15px}
.form-label{color:#708595;font-size:10px;letter-spacing:2px;text-transform:uppercase}.form-control{background:#070c11!important;border:1px solid #263744!important;color:#e9f8ff!important;border-radius:0;padding:13px 14px}.form-control:focus{border-color:var(--accent)!important;box-shadow:0 0 0 1px rgba(98,230,255,.15)!important}.btn-primary{background:transparent!important;border:1px solid var(--accent)!important;color:var(--accent)!important;border-radius:0!important;text-transform:uppercase;letter-spacing:2px;font-size:11px;padding:13px}.btn-primary:hover{background:var(--accent)!important;color:#041016!important;box-shadow:0 0 28px rgba(98,230,255,.18)}.status-text{font-size:10px;letter-spacing:1px;margin-top:13px;text-align:left}.status-success{color:var(--ok)}.status-error{color:var(--danger)}.status-info{color:#71899b}.brand-icon{color:var(--accent)}
@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}@keyframes scan{0%{transform:translateY(-130px);opacity:0}20%,80%{opacity:1}100%{transform:translateY(130px);opacity:0}}
@media(max-width:760px){body{overflow:auto}.login-card{grid-template-columns:1fr;width:94vw;min-height:auto;margin:24px auto}.brand{grid-column:1;border-right:0;border-bottom:1px solid #1c2833;padding:70px 30px 35px}.brand h1{font-size:2rem;margin-top:100px}.login-card>.nav-tabs{grid-column:1;margin:25px 30px 0}.login-card>#faceMode,.login-card>#passwordMode{grid-column:1;padding:20px 30px 35px}.brand:before{top:55px}.login-card:before{font-size:8px}}

    </style>

</head>
<body>

    <div class="login-card"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-shield-halved"></i></div>
            <h1><i class="fas fa-shield-alt me-2"></i>JARVIS-HYPER</h1>
            <p>SECURE ACCESS TERMINAL</p><div class="system-line"><span class="pulse-dot"></span>SYSTEM READY <span>•</span> ENCRYPTED SESSION</div>
        </div>

        <!-- Mode tabs -->
        <ul class="nav nav-tabs justify-content-center" id="authTabs">
            <li class="nav-item">
                <button class="nav-link active" id="faceTab" onclick="switchMode('face')">
                    <i class="fas fa-camera me-1"></i>Face
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="passwordTab" onclick="switchMode('password')">
                    <i class="fas fa-key me-1"></i>Password
                </button>
            </li>
        </ul>

        <!-- Face mode -->
        <div id="faceMode">
            <div class="camera-box" id="cameraBox">
                <div class="placeholder">
                    <i class="fas fa-camera"></i>
                    <div>Loading camera...</div>
                </div>
            </div>
            <button class="btn btn-primary w-100" id="verifyFaceBtn" onclick="verifyFace()">
                <i class="fas fa-user-check me-1"></i>Verify Face
            </button>
            <div class="status-text status-info" id="faceStatus">
                Position your face in the frame
            </div>
        </div>

        <!-- Password mode -->
        <div id="passwordMode" style="display: none;">
            <div class="mb-3">
                <label class="form-label">Access Code</label>
                <input type="password" class="form-control" id="passwordInput" placeholder="Enter access code">
            </div>
            <button class="btn btn-primary w-100" onclick="verifyPassword()">
                <i class="fas fa-unlock me-1"></i>Authenticate
            </button>
            <div class="status-text status-info" id="passwordStatus">
                Default: jarvis2026
            </div>
        </div>
        <div class="security-note"><i class="fas fa-lock"></i> Local biometric verification • Protected session</div>
    </div>

    <!-- face-api.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

    <script>
        // ============================================================
        // CONFIG
        // ============================================================
        const HARDCODED_PASSWORD = "jarvis2026";
        const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model";
        const REFERENCE_PHOTO = "/static/faces/moses.jpg";
        const MATCH_THRESHOLD = 0.55;   // Lower = stricter. 0.5-0.6 is typical.
        const USER_NAME = "Moses";

        let videoElement = null;
        let faceApiReady = false;
        let referenceDescriptor = null;

        // ============================================================
        // MODE SWITCHING
        // ============================================================
        function switchMode(mode) {
            document.getElementById('faceTab').classList.toggle('active', mode === 'face');
            document.getElementById('passwordTab').classList.toggle('active', mode === 'password');
            document.getElementById('faceMode').style.display = mode === 'face' ? 'block' : 'none';
            document.getElementById('passwordMode').style.display = mode === 'password' ? 'block' : 'none';
        }

        // ============================================================
        // SETUP CAMERA
        // ============================================================
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, facingMode: 'user' }
                });
                const cameraBox = document.getElementById('cameraBox');
                cameraBox.innerHTML = '<video id="videoFeed" autoplay muted playsinline></video>';
                videoElement = document.getElementById('videoFeed');
                videoElement.srcObject = stream;
                setFaceStatus('Camera ready. Position your face.', 'success');
            } catch (err) {
                console.error('[FACE] Camera error:', err);
                setFaceStatus('Camera access denied', 'error');
            }
        }

        // ============================================================
        // LOAD FACE-API MODELS
        // ============================================================
        async function loadFaceModels() {
            try {
                console.log('[FACE] Loading face-api models...');
                setFaceStatus('Loading face recognition models...', 'info');

                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
                ]);

                faceApiReady = true;
                console.log('[FACE] Models loaded');
                setFaceStatus('Models ready. Loading reference photo...', 'info');

                // Load reference photo and compute descriptor
                await loadReferenceDescriptor();

                setFaceStatus('Ready. Click "Verify Face"', 'success');
            } catch (err) {
                console.error('[FACE] Model load error:', err);
                setFaceStatus('Failed to load face models: ' + err.message, 'error');
            }
        }

        // ============================================================
        // LOAD REFERENCE PHOTO & COMPUTE DESCRIPTOR
        // ============================================================
        async function loadReferenceDescriptor() {
            try {
                console.log('[FACE] Loading reference:', REFERENCE_PHOTO);
                const img = await faceapi.fetchImage(REFERENCE_PHOTO);

                const detection = await faceapi
                    .detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptor();

                if (!detection) {
                    throw new Error('No face found in reference photo. Try a clearer photo.');
                }

                referenceDescriptor = detection.descriptor;
                console.log('[FACE] Reference descriptor computed');
            } catch (err) {
                console.error('[FACE] Reference load error:', err);
                throw err;
            }
        }

        // ============================================================
        // VERIFY FACE
        // ============================================================
        async function verifyFace() {
            if (!faceApiReady) {
                setFaceStatus('Models still loading. Please wait...', 'info');
                return;
            }
            if (!videoElement || !referenceDescriptor) {
                setFaceStatus('Camera or reference not ready', 'error');
                return;
            }

            const btn = document.getElementById('verifyFaceBtn');
            btn.disabled = true;
            setFaceStatus('Scanning your face...', 'info');

            try {
                const detection = await faceapi
                    .detectSingleFace(videoElement, new faceapi.TinyFaceDetectorOptions())
                    .withFaceLandmarks()
                    .withFaceDescriptor();

                if (!detection) {
                    setFaceStatus('⚠️ No face detected. Face the camera.', 'error');
                    btn.disabled = false;
                    return;
                }

                // Compute Euclidean distance
                const distance = faceapi.euclideanDistance(
                    referenceDescriptor,
                    detection.descriptor
                );

                console.log('[FACE] Match distance:', distance.toFixed(4));

                if (distance <= MATCH_THRESHOLD) {
                    setFaceStatus(`✓ Face verified (match: ${(1 - distance).toFixed(2)})`, 'success');
                    setTimeout(() => redirectToDashboard(USER_NAME), 800);
                } else {
                    setFaceStatus(`✗ Face not recognized (distance: ${distance.toFixed(2)}). Try password.`, 'error');
                    btn.disabled = false;
                }
            } catch (err) {
                console.error('[FACE] Verify error:', err);
                setFaceStatus('Verification error: ' + err.message, 'error');
                btn.disabled = false;
            }
        }

        // ============================================================
        // PASSWORD
        // ============================================================
        function verifyPassword() {
            const input = document.getElementById('passwordInput').value;
            const status = document.getElementById('passwordStatus');

            if (input === HARDCODED_PASSWORD) {
                status.textContent = '✓ Access granted';
                status.className = 'status-text status-success';
                setTimeout(() => redirectToDashboard('Sir'), 500);
            } else {
                status.textContent = '✗ Incorrect access code';
                status.className = 'status-text status-error';
                document.getElementById('passwordInput').value = '';
            }
        }

        // ============================================================
        // HELPERS
        // ============================================================
        function setFaceStatus(msg, type = 'info') {
            const el = document.getElementById('faceStatus');
            el.textContent = msg;
            el.className = 'status-text status-' + type;
        }

        function redirectToDashboard(name) {
            sessionStorage.setItem('jarvis.auth', 'yes');
            sessionStorage.setItem('jarvis.user', name);
            window.location.href = '/mega';
        }

        // ============================================================
        // INIT
        // ============================================================
        document.getElementById('passwordInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') verifyPassword();
        });

        window.addEventListener('load', async () => {
            await setupCamera();
            await loadFaceModels();
        });
    </script>

</body>
</html>
